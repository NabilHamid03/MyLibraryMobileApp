name: Build & release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write secret.properties from GitHub Secrets
        working-directory: MyLibrary
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}
        run: |
          cat > secret.properties <<EOF
          SUPABASE_URL = "${SUPABASE_URL}"
          SUPABASE_KEY = "${SUPABASE_KEY}"
          GOOGLE_KEY = "${GOOGLE_KEY}"
          EOF

      - name: Build debug APK
        working-directory: MyLibrary
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp MyLibrary/app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/MyLibrary-${GITHUB_REF_NAME}-debug.apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyLibrary-${{ github.ref_name }}-debug
          path: artifacts/*.apk
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
